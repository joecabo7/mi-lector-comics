<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Visor de Cómics Personal</title>
    <link rel="icon" href="data:,">
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .btn { background: #007bff; color: white; border: none; padding: 14px 28px; font-size: 16px; cursor: pointer; border-radius: 5px; margin: 10px; display: inline-block; font-weight: bold; }
        .btn:hover { background: #0056b3; }
        #visor { display: none; margin-top: 20px; }
        #comic-img { max-width: 100%; max-height: 85vh; display: block; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.7); }
        #estado { color: #00ff00; margin: 15px; font-family: monospace; font-size: 14px; }
    </style>
</head>
<body>

    <h1>📚 Mi Visor de Cómics de Google Drive</h1>
    <p>Haz clic abajo para explorar tus carpetas de Drive de forma directa.</p>
    
    <button class="btn" id="btn-explorar" onclick="autenticarYExplorar()">🌐 Ver mis archivos en Google Drive</button>

    <div id="estado"></div>

    <!-- Visor de imágenes -->
    <div id="visor">
        <div class="controles">
            <button class="btn" onclick="cambiarPagina(-1)" style="background:#333;">◀ Anterior</button>
            <button class="btn" onclick="cerrarVisor()" style="background:#dc3545;">✖ Cerrar Comic</button>
            <button class="btn" onclick="cambiarPagina(1)" style="background:#333;">Siguiente ▶</button>
        </div>
        <p>Página: <b id="num-pagina">0</b> / <span id="total-paginas">0</span></p>
        <img id="comic-img" src="" alt="Cargando página...">
    </div>

    <!-- Carga moderna de librerías oficiales de Google -->
    <script src="https://google.com"></script>
    <script src="https://google.com"></script>

    <script>
        // PEGA TUS CREDENCIALES AQUÍ
        const CLIENT_ID = '159354537005-ctmmipo3d8b2gs25l1e9rkkruertveb0.apps.googleusercontent.com';
        const API_KEY = 'AIzaSyCpEbJlI4mVv6ZtUDA2Xqx8k1403U28qiA';
        
        // El App ID es el número largo de tu proyecto (lo ves arriba en la consola de Google Cloud)
        const APP_ID = '159354537005'; 

        const SCOPES = 'https://googleapis.com';
        let accessToken = null;
        let paginasComic = [];
        let paginaActual = 0;

        // Listener para teclado en PC
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('visor').style.display === 'block') {
                if (e.key === 'ArrowRight' || e.key === ' ') cambiarPagina(1);
                if (e.key === 'ArrowLeft') cambiarPagina(-1);
                if (e.key === 'Escape') cerrarVisor();
            }
        });

        function autenticarYExplorar() {
            const estado = document.getElementById('estado');
            estado.innerText = "[Conectando] Abriendo autenticación...";
            
            const client = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (response) => {
                    if (response.error) {
                        estado.innerText = "[Error] Acceso denegado.";
                        return;
                    }
                    accessToken = response.access_token;
                    estado.innerText = "[Conectado] Cargando tus carpetas de Drive...";
                    gapi.load('picker', iniciarExploradorDrive);
                }
            });
            client.requestAccessToken();
        }

        function iniciarExploradorDrive() {
            // Crear el explorador visual de archivos (Picker) filtrando para ver carpetas y archivos .cbz/.zip
            const vistaDrive = new google.picker.View(google.picker.ViewId.DOCS);
            
            const picker = new google.picker.PickerBuilder()
                .enableFeature(google.picker.Feature.NAV_HIDDEN)
                .setDeveloperKey(API_KEY)
                .setAppId(APP_ID)
                .setOAuthToken(accessToken)
                .addView(vistaDrive)
                .setCallback(archivoSeleccionadoCallback)
                .setTitle("Selecciona tu cómic (.cbz)")
                .build();
                
            picker.setVisible(true);
        }

        async function archivoSeleccionadoCallback(data) {
            const estado = document.getElementById('estado');
            if (data.action === google.picker.Action.PICKED) {
                const fileId = data.docs[0].id;
                const fileName = data.docs[0].name;
                
                estado.innerText = `[Descargando] Abriendo "${fileName}" desde tu Drive...`;
                document.getElementById('visor').style.display = 'none';

                try {
                    // Descargar los datos binarios del archivo usando el Token de acceso seguro
                    const url = `https://googleapis.com{fileId}?alt=media`;
                    const res = await fetch(url, {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                    
                    if (!res.ok) throw new Error("Falla al descargar");
                    const blob = await res.blob();
                    
                    // Procesar con JSZip
                    const zip = await JSZip.loadAsync(blob);
                    paginasComic = [];
                    const promesasArchivos = [];

                    zip.forEach((relativePath, zipEntry) => {
                        if (!zipEntry.dir && /\.(jfif|jpeg|jpg|png|webp)\$/i.test(zipEntry.name)) {
                            promesasArchivos.push(
                                zipEntry.async("blob").then(blobComic => {
                                    return { name: zipEntry.name, url: URL.createObjectURL(blobComic) };
                                })
                            );
                        }
                    });

                    const imagenes = await Promise.all(promesasArchivos);
                    imagenes.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));
                    
                    paginasComic = imagenes.map(img => img.url);
                    
                    if(paginasComic.length > 0) {
                        paginaActual = 0;
                        mostrarPagina();
                        document.getElementById('visor').style.display = 'block';
                        estado.innerText = `[Leyendo] ${fileName}. ¡Usa las flechas del teclado!`;
                    } else {
                        estado.innerText = "[Error] El archivo elegido no tiene imágenes legibles dentro.";
                    }
                } catch (err) {
                    console.error(err);
                    estado.innerText = "[Error] No se pudo descargar el cómic. Verifica los permisos.";
                }
            } else if (data.action === google.picker.Action.CANCEL) {
                estado.innerText = "[Cancelado] No seleccionaste ningún archivo.";
            }
        }

        function mostrarPagina() {
            document.getElementById('comic-img').src = paginasComic[paginaActual];
            document.getElementById('num-pagina').textContent = paginaActual + 1;
            document.getElementById('total-paginas').textContent = paginasComic.length;
            window.scrollTo(0,0);
        }

        function cambiarPagina(direccion) {
            paginaActual += direccion;
            if (paginaActual < 0) paginaActual = 0;
            if (paginaActual >= paginasComic.length) paginaActual = paginasComic.length - 1;
            mostrarPagina();
        }

        function cerrarVisor() {
            document.getElementById('visor').style.display = 'none';
            document.getElementById('estado').innerText = "";
            paginasComic.forEach(url => URL.revokeObjectURL(url));
            paginasComic = [];
        }
    </script>
</body>
</html>
