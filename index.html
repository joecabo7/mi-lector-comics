<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <title>Mi Visor de Cómics Personal</title>
  <link rel="icon" href="data:,">

  <!-- Ambas librerías se cargan desde el mismo repositorio de GitHub Pages. -->
  <script src="./jszip.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
    h1 { font-size: clamp(1.45rem, 4vw, 2rem); }
    .btn { background: rgba(0, 123, 255, .78); color: white; border: 1px solid rgba(255,255,255,.16); padding: 14px 22px; font-size: 16px; cursor: pointer; border-radius: 5px; margin: 8px 4px; display: inline-block; font-weight: bold; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
    .btn:hover { background: rgba(0, 86, 179, .86); }
    .btn-peligro { background: rgba(220, 53, 69, .78) !important; }
    .btn-peligro:hover { background: rgba(189, 33, 48, .88) !important; }
    .btn:disabled { opacity: .55; cursor: wait; }
    #lista-comics { list-style: none; padding: 0; max-width: 700px; margin: 20px auto; text-align: left; }
    #lista-comics li { background: #1e1e1e; padding: 12px; margin: 6px 0; cursor: pointer; border-radius: 5px; border: 1px solid #333; display: flex; gap: 12px; justify-content: space-between; align-items: center; overflow-wrap: anywhere; }
    #lista-comics li:hover { background: #252525; border-color: #007bff; }
    #biblioteca { max-width: 760px; margin: 0 auto; }
    #buscador-contenedor { display: none; gap: 8px; max-width: 700px; margin: 16px auto; }
    #resultado-busqueda { display: none; }
    #lista-comics li { min-width: 0; }
    #lista-comics li .portada-comic { width: 58px; height: 78px; object-fit: contain; flex: 0 0 58px; background:#111; border-radius:4px; }
    #lista-comics li .nombre-comic { display: block; flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .btn-abrir-comic { flex: 0 0 auto; background: #087cff; color: #fff; border: 1px solid #3292ff; border-radius: 5px; padding: 8px 15px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn-abrir-comic:hover { background: #005fc7; }
    #buscador { flex: 1; min-width: 0; padding: 13px 14px; border-radius: 5px; border: 1px solid #555; background: #202020; color: white; font-size: 16px; }
    #btn-buscar { margin: 0; }
    #visor { display: none; position: fixed; inset: 0; z-index: 1000; background: #000; width: 100%; height: 100%; height: 100dvh; margin: 0; padding: 0; overflow: hidden; }
    .visor-barra { position: fixed; z-index: 1002; top: max(8px, env(safe-area-inset-top)); left: 8px; right: 8px; display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 6px; pointer-events: none; }
    .visor-barra > * { pointer-events: auto; }
    .visor-barra .btn { margin: 0; padding: 9px 11px; font-size: 14px; box-shadow: 0 2px 10px #0008; flex-shrink: 0; }
    .visor-barra select { backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
    #comic-img { transform-origin: 0 0; touch-action: none; }
    #paginas-contenedor.zoom-activo { overflow: hidden; }
    .visor-barra select { max-width: 175px; min-width: 0; padding: 9px 7px; color: #fff; background: rgba(36,36,36,.82); border: 1px solid rgba(255,255,255,.25); border-radius: 5px; font-size: 14px; }
    #sensibilidad-control { display:flex; align-items:center; gap:6px; padding:6px 9px; color:#fff; background:rgba(25,25,25,.72); border:1px solid rgba(255,255,255,.2); border-radius:6px; font-size:12px; backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); }
    #sensibilidad-mouse { width:90px; accent-color:#168cff; }
    #sensibilidad-valor { min-width:22px; text-align:right; }
    #btn-cerrar-comic { background:rgba(220,53,69,.82) !important; }
    #btn-cerrar-comic:hover { background:rgba(189,33,48,.94) !important; }
    #paginas-contenedor { position: absolute; inset: 0; overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; }
    #paginas-contenedor img { touch-action: none; }
    #paginas-contenedor.modo-una { display: flex; justify-content: center; align-items: flex-start; }
    #paginas-contenedor.ajuste-pantalla { align-items: center; }
    #paginas-contenedor.modo-multiple-vertical { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 58px 0 12px; }
    #paginas-contenedor.modo-multiple-horizontal { display: flex; flex-direction: row; align-items: center; gap: 3px; padding: 58px 12px 12px; overflow-x: auto; overflow-y: hidden; }
    #comic-img, .pagina-comic { display: block; flex: 0 0 auto; margin: 0 auto; box-shadow: none; object-fit: contain; max-width: none; }
    #paginas-contenedor.modo-una.ajuste-pantalla #comic-img { width: 100%; height: 100%; object-fit: contain; }
    #paginas-contenedor.modo-una.ajuste-ancho #comic-img { width: 100%; height: auto; object-fit: contain; }
    #paginas-contenedor.modo-multiple-vertical .pagina-comic { width: 100%; height: auto; }
    #paginas-contenedor.modo-multiple-horizontal .pagina-comic { height: calc(100% - 70px); width: auto; max-width: 95vw; object-fit: contain; }
    .controles { margin-bottom: 15px; }
    #estado { color: #00ff88; margin: 15px auto; max-width: 900px; font-family: monospace; font-size: 14px; overflow-wrap: anywhere; }
    .ayuda { color: #bbb; font-size: 13px; max-width: 700px; margin: 12px auto; line-height: 1.5; }
    @media (max-width: 480px) {
      body { padding: 12px; }
      .btn { padding: 12px 14px; font-size: 15px; }
      #lista-comics li { padding: 11px; }
      #buscador-contenedor { gap: 6px; }
      #buscador { padding: 12px 10px; }
      .visor-barra { left: 5px; right: 5px; gap: 4px; }
      .visor-barra .btn { padding: 8px 9px; font-size: 12px; }
      .visor-barra select { max-width: 120px; padding: 8px 5px; font-size: 12px; }
      #sensibilidad-control { display:none; }
    }
  </style>
</head>
<body>
  <h1>📚 Mi Visor de Cómics</h1>
  <p>Explora tus archivos CBZ de Google Drive desde el PC o el celular.</p>

  <button class="btn" id="btn-conectar" type="button">🔐 Conectar con Google Drive</button>
  <button class="btn" id="btn-salir" type="button" class="btn-peligro" style="display:none;">✖ Cerrar sesión</button>

  <div id="estado" role="status" aria-live="polite">Listo para conectar.</div>

  <section id="biblioteca">
    <p class="ayuda">Conecta Google Drive y escribe parte del nombre del cómic para buscarlo.</p>
    <div id="buscador-contenedor">
      <input id="buscador" type="search" placeholder="Buscar cómic por nombre..." autocomplete="off" aria-label="Buscar cómic por nombre">
      <button class="btn" id="btn-buscar" type="button">Buscar</button>
    </div>
    <p id="resultado-busqueda" class="ayuda" aria-live="polite">Conecta con Google Drive para buscar tus cómics.</p>
    <ul id="lista-comics"></ul>
  </section>

  <div id="visor">
    <div class="visor-barra">
      <button class="btn" type="button" id="btn-anterior" aria-label="Página anterior">◀</button>
      <button class="btn" type="button" id="btn-siguiente" aria-label="Página siguiente">▶</button>
      <select id="modo-vista" aria-label="Modo de visualización" title="Modo de visualización">
        <option value="una">Una página</option>
        <option value="vertical">Varias vertical</option>
        <option value="horizontal">Varias horizontal</option>
      </select>
      <select id="modo-ajuste" aria-label="Ajuste de página" title="Ajuste de página">
        <option value="pantalla">Ajustar pantalla</option>
        <option value="ancho">Ajustar ancho</option>
      </select>
      <label id="sensibilidad-control" for="sensibilidad-mouse" title="Sensibilidad del movimiento con el cursor">Movimiento <input id="sensibilidad-mouse" type="range" min="1" max="100" value="30"><span id="sensibilidad-valor">30</span></label>
      <button class="btn btn-peligro" type="button" id="btn-cerrar-comic" aria-label="Cerrar cómic" title="Cerrar cómic">✕</button>
    </div>
    <div id="paginas-contenedor" class="modo-una ajuste-pantalla">
      <img id="comic-img" src="" alt="Página del cómic">
    </div>
  </div>

  <script>
    // Este ID debe ser de un cliente OAuth de tipo "Aplicación web".
    const CLIENT_ID = '159354537005-ctmmipo3d8b2gs25l1e9rkkruertveb0.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/userinfo.email';
    // IMPORTANTE: reemplaza este valor por el correo exacto de tu cuenta Google.
    const ALLOWED_GOOGLE_EMAIL = 'REEMPLAZA_POR_TU_CORREO@gmail.com'.toLowerCase();
    const DRIVE_API = 'https://www.googleapis.com/drive/v3';

    let accessToken = null;
    let tokenClient = null;
    const CLAVE_SESION_GOOGLE = 'mi_lector_comics_google_autorizado';
    let recordarSesionGoogle = false;
    try { recordarSesionGoogle = localStorage.getItem(CLAVE_SESION_GOOGLE) === '1'; } catch (_) {}
    let paginasComic = [];
    let paginaActual = 0;
    let nombreComicActual = '';
    const CLAVE_CONFIG_VISTA = 'mi_lector_comics_config_vista';
    let configVista = cargarConfigVista();
    let escalaZoom = 1, desplazamientoX = 0, desplazamientoY = 0;
    let gestoZoom = null;
    let ultimoMouse = null;
    let sensibilidadMouse = 30;

    const $ = (id) => document.getElementById(id);

    function cargarConfigVista() {
      const predeterminada = { modo: 'una', ajuste: 'pantalla', sensibilidad: 30 };
      try {
        const guardada = JSON.parse(localStorage.getItem('mi_lector_comics_config_vista') || 'null');
        if (guardada && ['una', 'vertical', 'horizontal'].includes(guardada.modo) &&
            ['pantalla', 'ancho'].includes(guardada.ajuste)) return { ...predeterminada, ...guardada, sensibilidad: Math.max(1, Math.min(100, Number(guardada.sensibilidad) || 30)) };
      } catch (_) {}
      return predeterminada;
    }

    function guardarConfigVista() {
      try { localStorage.setItem(CLAVE_CONFIG_VISTA, JSON.stringify(configVista)); } catch (_) {}
    }

    function aplicarConfigVista() {
      sensibilidadMouse = Math.max(1, Math.min(100, Number(configVista.sensibilidad) || 30));
      $('sensibilidad-mouse').value = sensibilidadMouse;
      $('sensibilidad-valor').textContent = sensibilidadMouse;
      const cont = $('paginas-contenedor');
      cont.classList.remove('modo-una', 'modo-multiple-vertical', 'modo-multiple-horizontal', 'ajuste-pantalla', 'ajuste-ancho');
      cont.classList.add(configVista.modo === 'una' ? 'modo-una' :
        configVista.modo === 'vertical' ? 'modo-multiple-vertical' : 'modo-multiple-horizontal');
      if (configVista.modo === 'una') cont.classList.add(configVista.ajuste === 'ancho' ? 'ajuste-ancho' : 'ajuste-pantalla');
      $('modo-vista').value = configVista.modo;
      $('modo-ajuste').value = configVista.ajuste;
      $('modo-ajuste').disabled = configVista.modo !== 'una';
      $('sensibilidad-control').style.display = (configVista.modo === 'una' && configVista.ajuste === 'ancho' && window.matchMedia('(min-width: 481px)').matches) ? 'flex' : 'none';
      if (configVista.modo !== 'una' || configVista.ajuste !== 'ancho') centrarImagenPorRaton();
      $('btn-anterior').style.display = configVista.modo === 'una' ? 'inline-block' : 'none';
      $('btn-siguiente').style.display = configVista.modo === 'una' ? 'inline-block' : 'none';
      renderizarVistaComic();
    }

    function renderizarVistaComic() {
      const cont = $('paginas-contenedor');
      if (!paginasComic.length) return;
      if (configVista.modo === 'una') {
        cont.innerHTML = '<img id="comic-img" alt="Página del cómic">';
        $('comic-img').src = paginasComic[paginaActual];
        $('comic-img').addEventListener('dblclick', alternarAjuste);
        reiniciarZoom();
        configurarGestosZoom();
      } else {
        cont.innerHTML = '';
        paginasComic.forEach((url, i) => {
          const img = document.createElement('img');
          img.className = 'pagina-comic';
          img.src = url;
          img.alt = `Página ${i + 1}`;
          img.dataset.zoomScale = '1'; img.dataset.zoomX = '0'; img.dataset.zoomY = '0';
          img.loading = i > 3 ? 'lazy' : 'eager';
          img.addEventListener('dblclick', alternarAjuste);
          cont.appendChild(img);
        });
        configurarGestosZoom();
      }
    }

    function reiniciarZoom() {
      escalaZoom = 1;
      desplazamientoX = 0;
      desplazamientoY = 0;
      const img = $('comic-img');
      const cont = $('paginas-contenedor');
      if (img) img.style.transform = '';
      if (cont) cont.classList.remove('zoom-activo');
      gestoZoom = null;
    }

    function aplicarZoom() {
      const img = $('comic-img');
      const cont = $('paginas-contenedor');
      if (!img || !cont) return;
      if (escalaZoom <= 1 && Math.abs(desplazamientoX) < 0.5 && Math.abs(desplazamientoY) < 0.5) {
        escalaZoom = 1;
        desplazamientoX = 0;
        desplazamientoY = 0;
        img.style.transform = '';
        cont.classList.remove('zoom-activo');
        return;
      }
      cont.classList.toggle('zoom-activo', escalaZoom > 1);
      img.style.transformOrigin = '0 0';
      img.style.transform = `translate(${desplazamientoX}px, ${desplazamientoY}px) scale(${escalaZoom})`;
    }

    function configurarGestosZoom() {
      const cont = $('paginas-contenedor');
      if (!cont) return;
      let gesto = null;
      const getImage = (target) => target?.closest?.('img.pagina-comic, img#comic-img') || (configVista.modo === 'una' ? $('comic-img') : null);
      const centro = (touches) => ({ x:(touches[0].clientX+touches[1].clientX)/2, y:(touches[0].clientY+touches[1].clientY)/2 });
      cont.ontouchstart = (e) => {
        const img = getImage(e.target);
        if (e.touches.length === 2 && img) {
          e.preventDefault();
          const c = centro(e.touches), rect = img.getBoundingClientRect();
          const scale = Number(img.dataset.zoomScale || 1);
          const tx = Number(img.dataset.zoomX || 0), ty = Number(img.dataset.zoomY || 0);
          gesto = { type:'pinch', img, distance:Math.max(1,Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)), scale, tx, ty,
            pointX:(c.x-rect.left-tx)/scale, pointY:(c.y-rect.top-ty)/scale, baseLeft:rect.left-tx, baseTop:rect.top-ty };
        } else if (e.touches.length === 1) {
          const t=e.touches[0];
          const activeImg = getImage(e.target);
          const scale = activeImg ? Number(activeImg.dataset.zoomScale || 1) : 1;
          if (activeImg && scale > 1) {
            e.preventDefault();
            gesto={type:'pan',img:activeImg,x:t.clientX,y:t.clientY,tx:Number(activeImg.dataset.zoomX||0),ty:Number(activeImg.dataset.zoomY||0)};
          } else {
            gesto={type:'scroll',x:t.clientX,y:t.clientY,left:cont.scrollLeft,top:cont.scrollTop};
          }
        } else gesto=null;
      };
      cont.ontouchmove = (e) => {
        if (!gesto) return;
        if (gesto.type==='pinch' && e.touches.length===2) {
          e.preventDefault();
          const c=centro(e.touches), dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
          const scale=Math.max(1,Math.min(5,gesto.scale*dist/gesto.distance));
          let tx=c.x-gesto.baseLeft-gesto.pointX*scale, ty=c.y-gesto.baseTop-gesto.pointY*scale;
          if(scale===1){tx=0;ty=0;}
          gesto.img.dataset.zoomScale=String(scale); gesto.img.dataset.zoomX=String(tx); gesto.img.dataset.zoomY=String(ty);
          gesto.img.style.transformOrigin='0 0'; gesto.img.style.transform=scale===1?'':`translate(${tx}px,${ty}px) scale(${scale})`;
          cont.classList.toggle('zoom-activo',scale>1);
          if (configVista.modo==='una') { escalaZoom=scale; desplazamientoX=tx; desplazamientoY=ty; }
        } else if (gesto.type==='pan' && e.touches.length===1) {
          e.preventDefault(); const t=e.touches[0], tx=gesto.tx+t.clientX-gesto.x, ty=gesto.ty+t.clientY-gesto.y;
          gesto.img.dataset.zoomX=String(tx); gesto.img.dataset.zoomY=String(ty);
          gesto.img.style.transformOrigin='0 0'; gesto.img.style.transform=`translate(${tx}px,${ty}px) scale(${gesto.img.dataset.zoomScale||1})`;
          if (configVista.modo==='una') { desplazamientoX=tx; desplazamientoY=ty; }
        } else if (gesto.type==='scroll' && e.touches.length===1) {
          const t=e.touches[0]; cont.scrollTop=gesto.top+gesto.y-t.clientY; cont.scrollLeft=gesto.left+gesto.x-t.clientX;
        }
      };
      cont.ontouchend = (e) => { if (!e.touches.length) gesto=null; };
      cont.onmouseenter = (e) => { if (configVista.modo === 'una' && configVista.ajuste === 'ancho') ultimoMouse = { x:e.clientX,y:e.clientY }; };
      cont.onmouseleave = () => { ultimoMouse=null; centrarImagenPorRaton(); };
      cont.onmousemove = (e) => {
        if (configVista.modo !== 'una' || configVista.ajuste !== 'ancho' || e.pointerType === 'touch') return;
        if (!ultimoMouse) { ultimoMouse={x:e.clientX,y:e.clientY}; return; }
        const dx=e.clientX-ultimoMouse.x, dy=e.clientY-ultimoMouse.y; ultimoMouse={x:e.clientX,y:e.clientY};
        const factor=sensibilidadMouse/100, maxX=Math.max(40,cont.clientWidth*.45), maxY=Math.max(40,cont.clientHeight*.45);
        desplazamientoX=Math.max(-maxX,Math.min(maxX,desplazamientoX-dx*factor)); desplazamientoY=Math.max(-maxY,Math.min(maxY,desplazamientoY-dy*factor)); aplicarZoom();
      };
    }

    function centrarImagenPorRaton() {
      desplazamientoX = 0;
      desplazamientoY = 0;
      ultimoMouse = null;
      aplicarZoom();
    }

    window.addEventListener('blur', () => {
      if ($('visor').style.display === 'block') centrarImagenPorRaton();
    });

    function alternarAjuste() {
      if (configVista.modo !== 'una') return;
      configVista.ajuste = configVista.ajuste === 'pantalla' ? 'ancho' : 'pantalla';
      guardarConfigVista();
      aplicarConfigVista();
    }
    const estado = (mensaje, error = false) => {
      $('estado').textContent = mensaje;
      $('estado').style.color = error ? '#ff6b6b' : '#00ff88';
    };

    window.addEventListener('load', () => {
      $('btn-conectar').addEventListener('click', iniciarAutenticacion);
      $('btn-salir').addEventListener('click', cerrarSesion);
      $('btn-cerrar-comic').addEventListener('click', cerrarVisor);
      $('sensibilidad-mouse').addEventListener('input', () => {
        sensibilidadMouse = Number($('sensibilidad-mouse').value);
        configVista.sensibilidad = sensibilidadMouse;
        $('sensibilidad-valor').textContent = sensibilidadMouse;
        guardarConfigVista();
      });
      $('btn-anterior').addEventListener('click', () => cambiarPagina(-1));
      $('btn-siguiente').addEventListener('click', () => cambiarPagina(1));
      $('modo-vista').addEventListener('change', () => {
        configVista.modo = $('modo-vista').value;
        guardarConfigVista();
        aplicarConfigVista();
      });
      $('modo-ajuste').addEventListener('change', () => {
        configVista.ajuste = $('modo-ajuste').value;
        centrarImagenPorRaton();
        guardarConfigVista();
        aplicarConfigVista();
      });
      aplicarConfigVista();
      $('btn-buscar').addEventListener('click', buscarComics);
      $('buscador').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') buscarComics();
      });
      $('buscador').addEventListener('input', () => {
        // Al borrar el texto se vacían resultados anteriores para no confundir.
        if (!$('buscador').value.trim()) {
          $('lista-comics').innerHTML = '';
          $('resultado-busqueda').textContent = accessToken
            ? 'Escribe el nombre de un cómic y pulsa Buscar.'
            : 'Conecta con Google Drive para buscar tus cómics.';
        }
      });

      // Google Identity Services reemplaza el antiguo flujo response_type=token.
      if (!window.google || !google.accounts || !google.accounts.oauth2) {
        estado('No se pudo cargar el servicio de inicio de sesión de Google. Comprueba tu conexión e inténtalo de nuevo.', true);
        $('btn-conectar').disabled = true;
        return;
      }

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: async (response) => {
          if (response.error) {
            console.error('Error OAuth:', response);
            estado('Google no autorizó el acceso: ' + response.error, true);
            return;
          }
          if (!response.access_token) {
            estado('Google no devolvió un token de acceso. Inténtalo de nuevo.', true);
            return;
          }
          accessToken = response.access_token;
          try {
            if (!ALLOWED_GOOGLE_EMAIL || ALLOWED_GOOGLE_EMAIL.startsWith('reemplaza_')) {
              throw new Error('Configura ALLOWED_GOOGLE_EMAIL en el código con tu correo de Google antes de usar el lector.');
            }
            const identidad = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + accessToken } });
            if (!identidad.ok) throw new Error('No se pudo verificar la cuenta de Google. Vuelve a iniciar sesión.');
            const usuario = await identidad.json();
            if (!usuario.email || usuario.email.toLowerCase() !== ALLOWED_GOOGLE_EMAIL || usuario.email_verified !== true) {
              if (window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(accessToken, () => {});
              accessToken = null;
              throw new Error('Acceso denegado: esta aplicación solo admite la cuenta de Google autorizada.');
            }
          } catch (identityError) {
            accessToken = null;
            recordarSesionGoogle = false;
            try { localStorage.removeItem(CLAVE_SESION_GOOGLE); } catch (_) {}
            $('btn-conectar').style.display = 'inline-block';
            $('btn-salir').style.display = 'none';
            $('buscador-contenedor').style.display = 'none';
            $('resultado-busqueda').style.display = 'none';
            estado(identityError.message || 'No se pudo verificar la cuenta autorizada.', true);
            return;
          }
          recordarSesionGoogle = true;
          try { localStorage.setItem(CLAVE_SESION_GOOGLE, '1'); } catch (_) {}
          $('btn-conectar').style.display = 'none';
          $('btn-salir').style.display = 'inline-block';
          $('buscador-contenedor').style.display = 'flex';
          $('resultado-busqueda').style.display = 'block';
          estado('Cuenta autorizada. Conectado con Google Drive.');
          $('resultado-busqueda').textContent = 'Escribe el nombre del cómic que quieres encontrar.';
          $('buscador').focus();
        },
        error_callback: (error) => {
          console.error('Ventana OAuth:', error);
          $('btn-conectar').style.display = 'inline-block';
          $('btn-conectar').textContent = '🔐 Reanudar sesión de Google Drive';
          estado('Google no pudo recuperar la sesión automáticamente. Pulsa «Reanudar sesión» para continuar.', true);
        }
      });

      // Si este navegador ya autorizó el lector, intenta recuperar el acceso sin volver a pedir consentimiento.
      // Google puede exigir un clic o una nueva autorización por seguridad; en ese caso queda disponible el botón.
      if (recordarSesionGoogle) {
        $('btn-conectar').textContent = '🔐 Reanudar sesión de Google Drive';
        estado('Intentando recuperar la sesión de Google Drive...');
        try { tokenClient.requestAccessToken({ prompt: '' }); }
        catch (error) {
          console.warn('No se pudo recuperar automáticamente la sesión:', error);
          $('btn-conectar').style.display = 'inline-block';
          estado('Pulsa «Reanudar sesión» para recuperar el acceso a Google Drive.', true);
        }
      }
    });

    function iniciarAutenticacion() {
      if (!tokenClient) {
        estado('El servicio de Google aún no está listo. Recarga la página e inténtalo de nuevo.', true);
        return;
      }
      // Si ya se autorizó antes, solicita otro token sin repetir el consentimiento cuando Google lo permita.
      tokenClient.requestAccessToken({ prompt: (accessToken || recordarSesionGoogle) ? '' : 'consent' });
    }

    async function buscarComics() {
      if (!accessToken) {
        $('resultado-busqueda').textContent = 'Primero conecta con Google Drive.';
        return;
      }

      const termino = $('buscador').value.trim();
      const lista = $('lista-comics');
      lista.innerHTML = '';

      if (!termino) {
        $('resultado-busqueda').textContent = 'Escribe el nombre o una parte del nombre del cómic.';
        return;
      }

      $('btn-buscar').disabled = true;
      $('resultado-busqueda').textContent = 'Buscando coincidencias en Google Drive...';
      try {
        const encontrados = [];
        let pageToken = null;
        do {
          const params = new URLSearchParams({
            q: "trashed = false and (name contains '.cbz' or name contains '.CBZ')",
            fields: 'nextPageToken,files(id,name,size,mimeType)',
            pageSize: '100',
            orderBy: 'name'
          });
          if (pageToken) params.set('pageToken', pageToken);

          const res = await fetch(`${DRIVE_API}/files?${params.toString()}`, {
            headers: { Authorization: 'Bearer ' + accessToken }
          });
          if (!res.ok) throw await errorDrive(res, 'No se pudo consultar Google Drive');
          const data = await res.json();
          if (data.files) encontrados.push(...data.files);
          pageToken = data.nextPageToken || null;
        } while (pageToken);

        // Filtrado local sin distinguir mayúsculas/minúsculas, conservando búsqueda parcial.
        const terminoNormalizado = termino.toLocaleLowerCase();
        const coincidencias = encontrados
          .filter(file => file.name.toLocaleLowerCase().includes(terminoNormalizado))
          .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

        if (coincidencias.length === 0) {
          $('resultado-busqueda').textContent = `Sin resultados para "${termino}".`;
          return;
        }

        $('resultado-busqueda').textContent = `${coincidencias.length} resultado(s) para "${termino}".`;
        coincidencias.forEach(file => {
          const li = document.createElement('li');
          const portada = document.createElement('img');
          portada.className = 'portada-comic';
          portada.alt = 'Portada de ' + file.name;
          portada.loading = 'lazy';
          portada.src = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="58" height="78"><rect width="100%" height="100%" fill="#252525"/><text x="50%" y="50%" fill="#aaa" font-size="10" text-anchor="middle" dominant-baseline="middle">CBZ</text></svg>');
          portada.dataset.fileId = file.id;
          portada.dataset.loaded = '0';
          const nombre = document.createElement('span');
          nombre.className = 'nombre-comic';
          nombre.title = file.name;
          nombre.textContent = file.name;
          const abrir = document.createElement('button');
          abrir.type = 'button';
          abrir.className = 'btn-abrir-comic';
          abrir.textContent = 'Abrir';
          abrir.addEventListener('click', (e) => {
            e.stopPropagation();
            descargarYProcesarComic(file.id, file.name);
          });
          li.append(portada, nombre, abrir);
          lista.appendChild(li);
          observarPortada(portada, file.id, file.name);
        });
      } catch (err) {
        console.error('Error al buscar en Drive:', err);
        $('resultado-busqueda').textContent = err.message || 'Error al buscar en Google Drive.';
        if (err.status === 401) cerrarSesion(false);
      } finally {
        $('btn-buscar').disabled = false;
      }
    }

    // Las portadas se extraen bajo demanda cuando el resultado se acerca a la pantalla.
    const observadorPortadas = ('IntersectionObserver' in window) ? new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          observadorPortadas.unobserve(entry.target);
          cargarPortada(entry.target, entry.target.dataset.fileId, entry.target.alt.replace(/^Portada de /, ''));
        }
      });
    }, { rootMargin: '180px' }) : null;

    function observarPortada(img, fileId, fileName) {
      if (observadorPortadas) observadorPortadas.observe(img);
      else cargarPortada(img, fileId, fileName);
    }

    async function cargarPortada(img, fileId, fileName) {
      if (!accessToken || img.dataset.loaded === '1') return;
      img.dataset.loaded = '1';
      try {
        const res = await fetch(`${DRIVE_API}/files/${encodeURIComponent(fileId)}?alt=media`, { headers: { Authorization: 'Bearer ' + accessToken } });
        if (!res.ok) return;
        const zip = await JSZip.loadAsync(await res.blob());
        const imgs = [];
        zip.forEach((path, entry) => { if (!entry.dir && /\.(jpe?g|jfif|png|webp|gif|avif)$/i.test(entry.name)) imgs.push(entry); });
        imgs.sort((a,b) => a.name.localeCompare(b.name, undefined, { numeric:true, sensitivity:'base' }));
        if (!imgs.length || !img.isConnected) return;
        const blob = await imgs[0].async('blob');
        if (!img.isConnected) return;
        img.src = URL.createObjectURL(blob);
      } catch (e) { console.warn('No se pudo extraer portada de ' + fileName, e); }
    }

    async function errorDrive(res, prefijo) {
      let detalle = '';
      try {
        const data = await res.json();
        detalle = data.error?.message || '';
      } catch (_) {}
      const err = new Error(`${prefijo} (HTTP ${res.status})${detalle ? ': ' + detalle : ''}`);
      err.status = res.status;
      return err;
    }

    async function descargarYProcesarComic(fileId, fileName) {
      if (!window.JSZip) {
        estado('No se ha cargado jszip.min.js. Comprueba que esté junto a index.html en GitHub Pages.', true);
        return;
      }

      $('biblioteca').style.display = 'none';
      $('btn-conectar').style.display = 'none';
      $('btn-salir').style.display = 'none';
      $('estado').style.display = 'none';
      $('visor').style.display = 'block';
      $('paginas-contenedor').innerHTML = '<div style="color:white;padding:80px 20px;">Cargando cómic...</div>';
      estado(`Descargando "${fileName}"...`);

      try {
        const res = await fetch(`${DRIVE_API}/files/${encodeURIComponent(fileId)}?alt=media`, {
          headers: { Authorization: 'Bearer ' + accessToken }
        });
        if (!res.ok) throw await errorDrive(res, 'No se pudo descargar el cómic');
        const blob = await res.blob();

        estado('Descomprimiendo páginas...');
        const zip = await JSZip.loadAsync(blob);
        const archivosImagen = [];

        zip.forEach((relativePath, entry) => {
          if (!entry.dir && /\.(jpe?g|jfif|png|webp|gif|avif)$/i.test(entry.name)) {
            archivosImagen.push(entry);
          }
        });

        archivosImagen.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

        if (archivosImagen.length === 0) {
          estado('El archivo no contiene imágenes compatibles.', true);
          $('visor').style.display = 'none';
          $('biblioteca').style.display = 'block';
          $('estado').style.display = 'block';
          return;
        }

        // Convierte las páginas en orden para mantener el consumo de memoria controlado.
        limpiarPaginas();
        paginasComic = [];
        for (let i = 0; i < archivosImagen.length; i++) {
          estado(`Procesando páginas: ${i + 1} de ${archivosImagen.length}...`);
          const imageBlob = await archivosImagen[i].async('blob');
          paginasComic.push(URL.createObjectURL(imageBlob));
        }

        nombreComicActual = fileName;
        paginaActual = 0;
        $('visor').style.display = 'block';
        aplicarConfigVista();
        mostrarPagina();
      } catch (err) {
        console.error('Error al abrir el cómic:', err);
        $('visor').style.display = 'none';
        $('biblioteca').style.display = 'block';
        $('estado').style.display = 'block';
        estado(err.message || 'No se pudo abrir el cómic.', true);
      }
    }

    function mostrarPagina() {
      if (!paginasComic.length) return;
      if (configVista.modo === 'una') {
        const img = $('comic-img');
        if (img) img.src = paginasComic[paginaActual];
        const cont = $('paginas-contenedor');
        cont.scrollTop = 0;
        cont.scrollLeft = 0;
      }
      $('btn-anterior').disabled = paginaActual === 0;
      $('btn-siguiente').disabled = paginaActual === paginasComic.length - 1;
    }

    function cambiarPagina(direccion) {
      if (!paginasComic.length) return;
      const nueva = paginaActual + direccion;
      if (nueva < 0 || nueva >= paginasComic.length) return;
      paginaActual = nueva;
      reiniciarZoom();
      mostrarPagina();
    }

    function limpiarPaginas() {
      paginasComic.forEach(url => URL.revokeObjectURL(url));
      paginasComic = [];
      const cont = $('paginas-contenedor');
      if (cont) cont.innerHTML = '<img id="comic-img" alt="Página del cómic">';
    }

    function cerrarVisor() {
      $('visor').style.display = 'none';
      $('biblioteca').style.display = 'block';
      $('btn-conectar').style.display = accessToken ? 'none' : 'inline-block';
      $('btn-salir').style.display = accessToken ? 'inline-block' : 'none';
      $('estado').style.display = 'block';
      limpiarPaginas();
      paginaActual = 0;
      nombreComicActual = '';
      if (accessToken) {
        estado('Conectado con Google Drive.');
        $('resultado-busqueda').textContent = 'Busca otro cómic por nombre.';
        $('buscador').focus();
      }
    }

    function cerrarSesion(mostrarMensaje = true) {
      $('buscador-contenedor').style.display = 'none';
      $('resultado-busqueda').style.display = 'none';
      $('lista-comics').innerHTML = '';
      $('buscador').value = '';
      cerrarVisor();
      if (accessToken && window.google?.accounts?.oauth2) {
        google.accounts.oauth2.revoke(accessToken, () => {});
      }
      accessToken = null;
      recordarSesionGoogle = false;
      try { localStorage.removeItem(CLAVE_SESION_GOOGLE); } catch (_) {}
      $('btn-conectar').textContent = '🔐 Conectar con Google Drive';
      $('btn-conectar').style.display = 'inline-block';
      $('btn-salir').style.display = 'none';
      $('lista-comics').innerHTML = '';
      $('lista-comics').style.display = 'block';
      if (mostrarMensaje) estado('Sesión cerrada.');
    }

    document.addEventListener('keydown', (e) => {
      if ($('visor').style.display !== 'block') return;
      if (e.key === 'Escape') cerrarVisor();
      if (configVista.modo === 'una' && (e.key === 'ArrowRight' || e.key === ' ')) {
        e.preventDefault();
        cambiarPagina(1);
      }
      if (configVista.modo === 'una' && e.key === 'ArrowLeft') cambiarPagina(-1);
    });

    // No se usan gestos de deslizamiento para cambiar de página:
    // así el desplazamiento/zoom táctil en móviles no cambia accidentalmente de imagen.
  </script>
</body>
</html>
