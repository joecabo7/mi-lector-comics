<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <title>Mi Visor de Cómics Personal</title>
  <link rel="icon" href="data:,">

  <!-- Ambas librerías se cargan desde el mismo repositorio de GitHub Pages. -->
  <script src="./jszip.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
    h1 { font-size: clamp(1.45rem, 4vw, 2rem); }
    .btn { background: #007bff; color: white; border: none; padding: 14px 22px; font-size: 16px; cursor: pointer; border-radius: 5px; margin: 8px 4px; display: inline-block; font-weight: bold; }
    .btn:hover { background: #0056b3; }
    .btn:disabled { opacity: .55; cursor: wait; }
    #lista-comics { list-style: none; padding: 0; max-width: 700px; margin: 20px auto; text-align: left; }
    #lista-comics li { background: #1e1e1e; padding: 12px; margin: 6px 0; cursor: pointer; border-radius: 5px; border: 1px solid #333; display: flex; gap: 12px; justify-content: space-between; align-items: center; overflow-wrap: anywhere; }
    #lista-comics li:hover { background: #252525; border-color: #007bff; }
    #biblioteca { max-width: 760px; margin: 0 auto; }
    #buscador-contenedor { display: flex; gap: 8px; max-width: 700px; margin: 16px auto; }
    #buscador { flex: 1; min-width: 0; padding: 13px 14px; border-radius: 5px; border: 1px solid #555; background: #202020; color: white; font-size: 16px; }
    #btn-buscar { margin: 0; }
    #visor { display: none; position: fixed; inset: 0; z-index: 1000; background: #000; width: 100%; height: 100%; height: 100dvh; margin: 0; padding: 0; overflow: hidden; }
    .visor-barra { position: absolute; z-index: 2; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); }
    .visor-barra .btn { margin: 0; padding: 10px 14px; box-shadow: 0 2px 10px #0008; }
    #comic-img { width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; display: block; margin: 0 auto; box-shadow: none; }
    .controles { margin-bottom: 15px; }
    #estado { color: #00ff88; margin: 15px auto; max-width: 900px; font-family: monospace; font-size: 14px; overflow-wrap: anywhere; }
    .ayuda { color: #bbb; font-size: 13px; max-width: 700px; margin: 12px auto; line-height: 1.5; }
    @media (max-width: 480px) {
      body { padding: 12px; }
      .btn { padding: 12px 14px; font-size: 15px; }
      #lista-comics li { padding: 11px; }
      #buscador-contenedor { gap: 6px; }
      #buscador { padding: 12px 10px; }
    }
  </style>
</head>
<body>
  <h1>📚 Mi Visor de Cómics</h1>
  <p>Explora tus archivos CBZ de Google Drive desde el PC o el celular.</p>

  <button class="btn" id="btn-conectar" type="button">🔐 Conectar con Google Drive</button>
  <button class="btn" id="btn-salir" type="button" style="display:none;background:#dc3545;">✖ Cerrar sesión</button>

  <div id="estado" role="status" aria-live="polite">Listo para conectar.</div>

  <section id="biblioteca">
    <p class="ayuda">Conecta Google Drive y escribe parte del nombre del cómic para buscarlo.</p>
    <div id="buscador-contenedor">
      <input id="buscador" type="search" placeholder="Buscar cómic por nombre..." autocomplete="off" aria-label="Buscar cómic por nombre">
      <button class="btn" id="btn-buscar" type="button">Buscar</button>
    </div>
    <p id="resultado-busqueda" class="ayuda" aria-live="polite">Conecta con Google Drive para buscar tus cómics.</p>
    <ul id="lista-comics"></ul>
  </section>

  <div id="visor">
    <div class="visor-barra">
      <button class="btn" type="button" id="btn-cerrar-comic" style="background:#dc3545;">✖ Cerrar cómic</button>
    </div>
    <img id="comic-img" src="" alt="Página del cómic">
  </div>

  <script>
    // Este ID debe ser de un cliente OAuth de tipo "Aplicación web".
    const CLIENT_ID = '159354537005-ctmmipo3d8b2gs25l1e9rkkruertveb0.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';
    const DRIVE_API = 'https://www.googleapis.com/drive/v3';

    let accessToken = null;
    let tokenClient = null;
    let paginasComic = [];
    let paginaActual = 0;
    let nombreComicActual = '';

    const $ = (id) => document.getElementById(id);
    const estado = (mensaje, error = false) => {
      $('estado').textContent = mensaje;
      $('estado').style.color = error ? '#ff6b6b' : '#00ff88';
    };

    window.addEventListener('load', () => {
      $('btn-conectar').addEventListener('click', iniciarAutenticacion);
      $('btn-salir').addEventListener('click', cerrarSesion);
      $('btn-cerrar-comic').addEventListener('click', cerrarVisor);
      $('btn-buscar').addEventListener('click', buscarComics);
      $('buscador').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') buscarComics();
      });
      $('buscador').addEventListener('input', () => {
        // Al borrar el texto se vacían resultados anteriores para no confundir.
        if (!$('buscador').value.trim()) {
          $('lista-comics').innerHTML = '';
          $('resultado-busqueda').textContent = accessToken
            ? 'Escribe el nombre de un cómic y pulsa Buscar.'
            : 'Conecta con Google Drive para buscar tus cómics.';
        }
      });

      // Google Identity Services reemplaza el antiguo flujo response_type=token.
      if (!window.google || !google.accounts || !google.accounts.oauth2) {
        estado('No se pudo cargar el servicio de inicio de sesión de Google. Comprueba tu conexión e inténtalo de nuevo.', true);
        $('btn-conectar').disabled = true;
        return;
      }

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: async (response) => {
          if (response.error) {
            console.error('Error OAuth:', response);
            estado('Google no autorizó el acceso: ' + response.error, true);
            return;
          }
          if (!response.access_token) {
            estado('Google no devolvió un token de acceso. Inténtalo de nuevo.', true);
            return;
          }
          accessToken = response.access_token;
          $('btn-conectar').style.display = 'none';
          $('btn-salir').style.display = 'inline-block';
          estado('Conectado con Google Drive.');
          $('resultado-busqueda').textContent = 'Escribe el nombre del cómic que quieres encontrar.';
          $('buscador').focus();
        },
        error_callback: (error) => {
          console.error('Ventana OAuth:', error);
          estado('No se pudo completar el inicio de sesión de Google. Revisa las ventanas emergentes y la configuración OAuth.', true);
        }
      });
    });

    function iniciarAutenticacion() {
      if (!tokenClient) {
        estado('El servicio de Google aún no está listo. Recarga la página e inténtalo de nuevo.', true);
        return;
      }
      // El token se solicita tras la acción directa del usuario.
      tokenClient.requestAccessToken({ prompt: accessToken ? '' : 'consent' });
    }

    async function buscarComics() {
      if (!accessToken) {
        $('resultado-busqueda').textContent = 'Primero conecta con Google Drive.';
        return;
      }

      const termino = $('buscador').value.trim();
      const lista = $('lista-comics');
      lista.innerHTML = '';

      if (!termino) {
        $('resultado-busqueda').textContent = 'Escribe el nombre o una parte del nombre del cómic.';
        return;
      }

      $('btn-buscar').disabled = true;
      $('resultado-busqueda').textContent = 'Buscando coincidencias en Google Drive...';
      try {
        const encontrados = [];
        let pageToken = null;
        do {
          const params = new URLSearchParams({
            q: "trashed = false and (name contains '.cbz' or name contains '.CBZ')",
            fields: 'nextPageToken,files(id,name,size,mimeType)',
            pageSize: '100',
            orderBy: 'name'
          });
          if (pageToken) params.set('pageToken', pageToken);

          const res = await fetch(`${DRIVE_API}/files?${params.toString()}`, {
            headers: { Authorization: 'Bearer ' + accessToken }
          });
          if (!res.ok) throw await errorDrive(res, 'No se pudo consultar Google Drive');
          const data = await res.json();
          if (data.files) encontrados.push(...data.files);
          pageToken = data.nextPageToken || null;
        } while (pageToken);

        // Filtrado local sin distinguir mayúsculas/minúsculas, conservando búsqueda parcial.
        const terminoNormalizado = termino.toLocaleLowerCase();
        const coincidencias = encontrados
          .filter(file => file.name.toLocaleLowerCase().includes(terminoNormalizado))
          .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

        if (coincidencias.length === 0) {
          $('resultado-busqueda').textContent = `Sin resultados para "${termino}".`;
          return;
        }

        $('resultado-busqueda').textContent = `${coincidencias.length} resultado(s) para "${termino}".`;
        coincidencias.forEach(file => {
          const li = document.createElement('li');
          const nombre = document.createElement('span');
          nombre.textContent = '📖 ' + file.name;
          const abrir = document.createElement('b');
          abrir.textContent = 'Abrir';
          abrir.style.color = '#4da3ff';
          li.append(nombre, abrir);
          li.addEventListener('click', () => descargarYProcesarComic(file.id, file.name));
          lista.appendChild(li);
        });
      } catch (err) {
        console.error('Error al buscar en Drive:', err);
        $('resultado-busqueda').textContent = err.message || 'Error al buscar en Google Drive.';
        if (err.status === 401) cerrarSesion(false);
      } finally {
        $('btn-buscar').disabled = false;
      }
    }

    async function errorDrive(res, prefijo) {
      let detalle = '';
      try {
        const data = await res.json();
        detalle = data.error?.message || '';
      } catch (_) {}
      const err = new Error(`${prefijo} (HTTP ${res.status})${detalle ? ': ' + detalle : ''}`);
      err.status = res.status;
      return err;
    }

    async function descargarYProcesarComic(fileId, fileName) {
      if (!window.JSZip) {
        estado('No se ha cargado jszip.min.js. Comprueba que esté junto a index.html en GitHub Pages.', true);
        return;
      }

      $('biblioteca').style.display = 'none';
      $('btn-conectar').style.display = 'none';
      $('btn-salir').style.display = 'none';
      $('estado').style.display = 'none';
      $('visor').style.display = 'block';
      $('comic-img').alt = `Cargando ${fileName}...`;
      estado(`Descargando "${fileName}"...`);

      try {
        const res = await fetch(`${DRIVE_API}/files/${encodeURIComponent(fileId)}?alt=media`, {
          headers: { Authorization: 'Bearer ' + accessToken }
        });
        if (!res.ok) throw await errorDrive(res, 'No se pudo descargar el cómic');
        const blob = await res.blob();

        estado('Descomprimiendo páginas...');
        const zip = await JSZip.loadAsync(blob);
        const archivosImagen = [];

        zip.forEach((relativePath, entry) => {
          if (!entry.dir && /\.(jpe?g|jfif|png|webp|gif|avif)$/i.test(entry.name)) {
            archivosImagen.push(entry);
          }
        });

        archivosImagen.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

        if (archivosImagen.length === 0) {
          estado('El archivo no contiene imágenes compatibles.', true);
          $('visor').style.display = 'none';
          $('biblioteca').style.display = 'block';
          $('estado').style.display = 'block';
          return;
        }

        // Convierte las páginas en orden para mantener el consumo de memoria controlado.
        limpiarPaginas();
        paginasComic = [];
        for (let i = 0; i < archivosImagen.length; i++) {
          estado(`Procesando páginas: ${i + 1} de ${archivosImagen.length}...`);
          const imageBlob = await archivosImagen[i].async('blob');
          paginasComic.push(URL.createObjectURL(imageBlob));
        }

        nombreComicActual = fileName;
        paginaActual = 0;
        $('visor').style.display = 'block';
        mostrarPagina();
      } catch (err) {
        console.error('Error al abrir el cómic:', err);
        $('visor').style.display = 'none';
        $('biblioteca').style.display = 'block';
        $('estado').style.display = 'block';
        estado(err.message || 'No se pudo abrir el cómic.', true);
      }
    }

    function mostrarPagina() {
      if (!paginasComic.length) return;
      $('comic-img').src = paginasComic[paginaActual];
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cambiarPagina(direccion) {
      if (!paginasComic.length) return;
      const nueva = paginaActual + direccion;
      if (nueva < 0 || nueva >= paginasComic.length) return;
      paginaActual = nueva;
      mostrarPagina();
    }

    function limpiarPaginas() {
      paginasComic.forEach(url => URL.revokeObjectURL(url));
      paginasComic = [];
      $('comic-img').removeAttribute('src');
    }

    function cerrarVisor() {
      $('visor').style.display = 'none';
      $('biblioteca').style.display = 'block';
      $('btn-conectar').style.display = accessToken ? 'none' : 'inline-block';
      $('btn-salir').style.display = accessToken ? 'inline-block' : 'none';
      $('estado').style.display = 'block';
      limpiarPaginas();
      paginaActual = 0;
      nombreComicActual = '';
      if (accessToken) {
        estado('Conectado con Google Drive.');
        $('resultado-busqueda').textContent = 'Busca otro cómic por nombre.';
        $('buscador').focus();
      }
    }

    function cerrarSesion(mostrarMensaje = true) {
      cerrarVisor();
      if (accessToken && window.google?.accounts?.oauth2) {
        google.accounts.oauth2.revoke(accessToken, () => {});
      }
      accessToken = null;
      $('btn-conectar').style.display = 'inline-block';
      $('btn-salir').style.display = 'none';
      $('lista-comics').innerHTML = '';
      $('lista-comics').style.display = 'block';
      if (mostrarMensaje) estado('Sesión cerrada.');
    }

    document.addEventListener('keydown', (e) => {
      if ($('visor').style.display !== 'block') return;
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        cambiarPagina(1);
      }
      if (e.key === 'ArrowLeft') cambiarPagina(-1);
      if (e.key === 'Escape') cerrarVisor();
    });

    // Gestos táctiles para pasar página en celulares.
    let touchStartX = null;
    $('comic-img').addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    $('comic-img').addEventListener('touchend', e => {
      if (touchStartX === null) return;
      const delta = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(delta) > 45) cambiarPagina(delta < 0 ? 1 : -1);
      touchStartX = null;
    }, { passive: true });
  </script>
</body>
</html>
