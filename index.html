<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Visor de Cómics Personal</title>
    <link rel="icon" href="data:,">
    <!-- Cargamos JSZip para descomprimir el CBZ directamente en tu pantalla -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .btn { background: #007bff; color: white; border: none; padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 5px; margin: 10px; display: inline-block; }
        .btn:hover { background: #0056b3; }
        #file-input { display: none; }
        #visor { display: none; margin-top: 20px; }
        #comic-img { max-width: 100%; max-height: 85vh; display: block; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .controles { margin-bottom: 15px; }
        #estado { color: #00ff00; margin: 15px; font-family: monospace; }
    </style>
</head>
<body>

    <h1>📚 Mi Visor de Cómics Privado</h1>
    <p>Selecciona un archivo .cbz de tu dispositivo o de tu app de Google Drive.</p>
    
    <!-- Botón para elegir archivo -->
    <label for="file-input" class="btn">📂 Seleccionar Cómic (.cbz)</label>
    <input type="file" id="file-input" accept=".cbz,.zip" onchange="procesarArchivo(this.files[0])">

    <div id="estado"></div>

    <!-- Visor de imágenes -->
    <div id="visor">
        <div class="controles">
            <button class="btn" onclick="cambiarPagina(-1)" style="background:#333;">◀ Anterior</button>
            <button class="btn" onclick="cerrarVisor()" style="background:#dc3545;">✖ Cerrar</button>
            <button class="btn" onclick="cambiarPagina(1)" style="background:#333;">Siguiente ▶</button>
        </div>
        <p>Página: <span id="num-pagina">0</span> / <span id="total-paginas">0</span></p>
        <img id="comic-img" src="" alt="Cargando página...">
    </div>

    <script>
        let paginasComic = [];
        let paginaActual = 0;

        async function procesarArchivo(file) {
            if (!file) return;
            
            const estado = document.getElementById('estado');
            estado.innerText = "[Procesando] Leyendo el archivo... por favor espera.";
            document.getElementById('visor').style.display = 'none';

            try {
                // JSZip lee el archivo que seleccionó el usuario directamente
                const zip = await JSZip.loadAsync(file);
                paginasComic = [];
                const promesasArchivos = [];

                zip.forEach((relativePath, zipEntry) => {
                    if (!zipEntry.dir && /\.(jfif|jpeg|jpg|png|webp)$/i.test(zipEntry.name)) {
                        promesasArchivos.push(
                            zipEntry.async("blob").then(blob => {
                                return { name: zipEntry.name, url: URL.createObjectURL(blob) };
                            })
                        );
                    }
                });

                const imagenes = await Promise.all(promesasArchivos);
                
                // Ordenar las páginas alfabéticamente/numéricamente
                imagenes.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));
                
                paginasComic = imagenes.map(img => img.url);
                
                if(paginasComic.length > 0) {
                    paginaActual = 0;
                    mostrarPagina();
                    document.getElementById('visor').style.display = 'block';
                    estado.innerText = "[Listo] ¡Cómic cargado con éxito!";
                } else {
                    estado.style.color = "#ff0000";
                    estado.innerText = "[Error] El archivo no contiene imágenes válidas (.jpg, .png, .webp).";
                }

            } catch (err) {
                console.error(err);
                estado.style.color = "#ff0000";
                estado.innerText = "[Error] No se pudo procesar el archivo comprimido.";
            }
        }

        function mostrarPagina() {
            document.getElementById('comic-img').src = paginasComic[paginaActual];
            document.getElementById('num-pagina').textContent = paginaActual + 1;
            document.getElementById('total-paginas').textContent = paginasComic.length;
            window.scrollTo(0,0);
        }

        function cambiarPagina(direccion) {
            paginaActual += direccion;
            if (paginaActual < 0) paginaActual = 0;
            if (paginaActual >= paginasComic.length) paginaActual = paginasComic.length - 1;
            mostrarPagina();
        }

        function cerrarVisor() {
            document.getElementById('visor').style.display = 'none';
            document.getElementById('estado').innerText = "";
            paginasComic.forEach(url => URL.revokeObjectURL(url));
            paginasComic = [];
            document.getElementById('file-input').value = "";
        }
    </script>
</body>
</html>
